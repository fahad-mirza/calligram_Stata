<html lang='en'><head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<script>(function(){var m=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

<title>Customer comments in Urdu, in Nastaliq</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
       font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
       display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto minmax(0,1fr)}
  #hdr{grid-column:1/-1;grid-row:1;display:flex;align-items:center;flex-wrap:wrap;gap:6px 16px;
       padding:10px 20px;border-bottom:1px solid rgba(127,127,127,.22)}
  #hdr h1{margin:0;font-weight:700;letter-spacing:.3px;line-height:1.25}
  #nw{font-size:14px;opacity:.6}
  #tabs{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
  #stage{grid-column:1;grid-row:2;min-height:0;display:flex;flex-direction:column;align-items:center;
       justify-content:center;gap:14px;padding:12px;min-width:0}
  .pane{display:flex;flex-direction:column;align-items:center}
  .plabel{font-weight:600;opacity:.85}
  .legend{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:13px}
  .legend .lt{font-weight:600;opacity:.85}
  .legend .bar{display:inline-block;width:170px;height:10px;border-radius:5px}
  .legend .sw{display:inline-flex;align-items:center;gap:6px}
  .legend .sw i{display:inline-block;width:12px;height:12px;border-radius:3px}
  svg.wc{display:block;max-width:100%;height:auto}
  #tt{position:fixed;display:none;pointer-events:none;z-index:30;background:rgba(0,0,0,.85);
       color:#fff;padding:6px 10px;border-radius:6px;font-size:13px}
  #credit{position:fixed;left:14px;bottom:8px;font-size:11px;opacity:.4}
  #panel~#credit{display:none}
  #expbtn{position:fixed;right:16px;bottom:14px;padding:9px 18px;border:none;border-radius:8px;
       background:#4e79a7;color:#fff;font:inherit;font-size:14px;cursor:pointer;
       box-shadow:0 6px 18px rgba(0,0,0,.3)}
/* calligram interactive layer styles (v2.3); inlined into the HTML page */
body.wc-fit{height:100vh;overflow:hidden}
body.wc-fit #stage{overflow:hidden}
body.has-tabs .plabel{display:none}

/* words: hover focus, load animation, zoom cursor */
svg.wc .w{cursor:pointer;transition:opacity .18s}
svg.wc.big .w{transition:none}          /* large clouds: no fades (each would redraw the whole map) */
.wc-veil{position:fixed;display:none;pointer-events:none;background:var(--bg);opacity:.72;z-index:5}
.wc-lift{position:fixed;display:none;pointer-events:none;z-index:6;overflow:visible}
svg.wc .w .hit{fill:transparent}
svg.wc.focusing .w:not(.hot){opacity:.25 !important}
html.wc-pre svg.wc{opacity:0}   /* until the fade-in starts (see ui.js); the whole cloud, not each word,
                                   so revealing it does not start a transition on every word */
svg.wc.zoomed{cursor:grab}
svg.wc.dragging{cursor:grabbing}

/* hover card */
#tt{background:rgba(14,19,34,.94);color:#f2f2f2;border:1px solid rgba(255,255,255,.14);
    border-radius:10px;padding:9px 12px;font-size:12.5px;line-height:1.5;
    box-shadow:0 10px 28px rgba(0,0,0,.35);max-width:280px}
#tt .tw{font-weight:700;font-size:16px;margin-bottom:2px}
#tt .th{opacity:.55;font-size:11px;margin-top:4px}
#tt .tn{margin-top:3px;color:#ffd479}

/* header tabs */
#tabs button{font:inherit;font-size:13px;color:var(--ink);cursor:pointer;background:transparent;
    border:1px solid rgba(127,127,127,.38);border-radius:16px;padding:5px 14px}
#tabs button:hover{background:rgba(127,127,127,.16)}
#tabs button.on{background:rgba(127,127,127,.30);font-weight:600}

/* side panel: open (labelled) or rail (icons) */
#panel{grid-column:2;grid-row:2;display:flex;overflow:hidden;min-height:0;
    border-left:1px solid rgba(127,127,127,.22);background:rgba(127,127,127,.06);
    transition:width .22s ease}
#panel.open{width:320px}
/* fixed (no fitting): the page scrolls, the panel stays in view at window height */
body:not(.wc-fit) #panel{position:sticky;top:0;align-self:start}
#panel.rail{width:60px}
#panel.open .railbox,#panel.rail .fullbox{display:none}
.railbox{display:flex;flex-direction:column;align-items:center;gap:4px;width:60px;padding:10px 0;overflow-y:auto;min-height:0}
.fullbox{display:flex;flex-direction:column;width:320px;padding:4px 18px 14px;overflow-y:auto;min-height:0}
/* a category key that hides and shows its words */
.legend .sw[data-cat]{cursor:pointer;user-select:none;border-radius:6px;padding:1px 5px}
.legend .sw[data-cat]:hover{background:rgba(127,127,127,.18)}
.legend .sw.off{opacity:.35;text-decoration:line-through}

/* buttons */
.ib{width:40px;height:40px;flex:none;display:inline-flex;align-items:center;justify-content:center;
    border-radius:10px;border:1px solid transparent;background:transparent;color:var(--ink);
    cursor:pointer;position:relative;padding:0}
.ib:hover:not(:disabled){background:rgba(127,127,127,.18)}
.ib:disabled{opacity:.35;cursor:default}
.ib.badge:not([data-badge=""])::after{content:attr(data-badge);position:absolute;top:2px;right:2px;
    min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:#e15759;color:#fff;
    font-size:10px;line-height:16px;font-weight:700}
.btn{font:inherit;font-size:13px;color:var(--ink);background:rgba(127,127,127,.12);
    border:1px solid rgba(127,127,127,.35);border-radius:8px;padding:7px 13px;cursor:pointer}
.btn:hover{background:rgba(127,127,127,.24)}
.linkbtn{border:0;background:none;color:inherit;opacity:.75;font:inherit;font-size:12px;cursor:pointer;
    padding:6px 0;margin-right:14px;text-decoration:underline;text-underline-offset:3px}
.linkbtn:hover{opacity:1}
.linkbtn:disabled{opacity:.35;cursor:default;text-decoration:none}
.ib:focus-visible,.btn:focus-visible,.linkbtn:focus-visible,.swatch:focus-visible,#tabs button:focus-visible{
    outline:2px solid #4e79a7;outline-offset:2px}

/* rail details */
.sep{width:28px;height:1px;background:rgba(127,127,127,.3);margin:6px 0}
.vsl{display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0}
.vrange{writing-mode:vertical-lr;direction:rtl;width:22px;height:120px;margin:0;accent-color:#4e79a7}
.vlab{font-size:11px;opacity:.75;font-variant-numeric:tabular-nums}

/* open panel details */
.phead{display:flex;align-items:center;justify-content:space-between;padding:10px 0 2px}
.ptitle{font-weight:700;font-size:15px;letter-spacing:.3px}
.sec{padding:12px 0;border-bottom:1px solid rgba(127,127,127,.18)}
.sec h2{margin:0 0 8px;font-size:11.5px;text-transform:uppercase;letter-spacing:.8px;opacity:.6;font-weight:700}
.searchwrap{display:flex;align-items:center;gap:8px;padding:0 10px;border-radius:10px;
    border:1px solid rgba(127,127,127,.35);background:rgba(127,127,127,.10)}
.searchwrap:focus-within{border-color:#4e79a7}
.searchwrap input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;
    font-size:14px;padding:9px 0;outline:none}
.sicon{display:inline-flex;opacity:.6}
.note{font-size:12px;opacity:.7;margin-top:6px;min-height:1em;font-variant-numeric:tabular-nums}
.hrow{display:flex;align-items:center;gap:10px}
.hrow .note{margin:0;min-width:3em;text-align:right}
.hrow input[type=range]{flex:1;accent-color:#4e79a7}
.list{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:22px minmax(0,1fr) 56px 52px;align-items:center;gap:8px;
    padding:4px 6px;border-radius:6px;cursor:pointer;font-size:13px}
.row:hover{background:rgba(127,127,127,.15)}
.row.off{opacity:.4}
.row.off .nm{text-decoration:line-through}
.rk{opacity:.5;font-size:11px;text-align:right;font-variant-numeric:tabular-nums}
.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ct{text-align:right;opacity:.75;font-variant-numeric:tabular-nums}
.bw{height:8px;border-radius:4px;background:rgba(127,127,127,.15);overflow:hidden}
.bar{display:block;height:100%;border-radius:4px}
.hint{font-size:11px;opacity:.55;margin-top:6px}
.brow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.brow .ib{border-color:rgba(127,127,127,.35)}
.swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:10px}
.swatch{height:26px;border-radius:7px;border:2px solid transparent;cursor:pointer;padding:0;
    box-shadow:inset 0 0 0 1px rgba(127,127,127,.35)}
.swatch.on{border-color:var(--ink)}
.pfoot{display:flex;align-items:center;justify-content:space-between;padding-top:12px;margin-top:auto}
.credit{font-size:11px;opacity:.45}

/* shortcuts list */
.help{position:fixed;inset:0;background:rgba(0,0,0,.45);align-items:center;justify-content:center;z-index:40}
.helpcard{background:var(--bg);color:var(--ink);border:1px solid rgba(127,127,127,.35);border-radius:14px;
    padding:20px 24px;min-width:320px;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.helpcard h2{margin:0 0 12px;font-size:16px}
.helpcard table{margin-bottom:14px;border-collapse:collapse}
.helpcard td{padding:5px 12px 5px 0;font-size:13px}
kbd{display:inline-block;min-width:22px;text-align:center;padding:2px 7px;border-radius:5px;
    border:1px solid rgba(127,127,127,.45);background:rgba(127,127,127,.12);font:12px ui-monospace,Consolas,monospace}

@media (max-width:760px){#panel.open{width:270px}.fullbox{width:270px}}
@media (prefers-reduced-motion:reduce){#panel{transition:none}}
</style></head>

    panes.forEach(function (p) {
      var n = p._words.length;
      p._words.forEach(function (w, i) {
        w.setAttribute('fill', id === 'orig' ? w.getAttribute('data-fill0') : paletteColor(id, i, n));
      });
    });
    if (ui.swatches) ui.swatches.forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-id') === id); });
    renderList();
  }
  function cyclePalette() {
    if (cfg.fixedcolors) return;          // the colours carry meaning (colorby() etc.)
    var k = 0;
    PALETTES.forEach(function (q, i) { if (q.id === state.palette) k = i; });
    var next = PALETTES[(k + 1) % PALETTES.length];
    setPalette(next.id);
    if (ui.railPal) ui.railPal.title = 'Colours: ' + next.name + ' (click for next)';
  }

  // ── tabs ──────────────────────────────────────────────────────────────────
  function show(k, animate) {
    state.active = k;
    panes.forEach(function (p, i) { p.style.display = i === k ? '' : 'none'; });
    if (ui.tabs) ui.tabs.forEach(function (b, i) { b.classList.toggle('on', i === k); b.setAttribute('aria-selected', i === k ? 'true' : 'false'); });
    var p = pane();
    sliders.forEach(function (s) { s.max = p._max; s.disabled = p._max <= 1; });
    apply();
    fit();
    if (animate) enter(p);
  }

  // ── fullscreen ────────────────────────────────────────────────────────────
  function toggleFullscreen() {
    var el = doc.documentElement;
    if (!doc.fullscreenElement) { if (el.requestFullscreen) el.requestFullscreen(); }
    else if (doc.exitFullscreen) doc.exitFullscreen();
  }

  // ── export what is shown ──────────────────────────────────────────────────
  function stem() {
    var s = cfg.stem || 'wordcloud';
    if (panes.length > 1) s += '_' + (pane().getAttribute('data-file') || (state.active + 1));
    return s;
  }
  // what is saved: the whole cloud at home zoom, else what is shown
  function saveView(p) {
    var vb = isZoomed(p) ? p._vb : [0, 0, p._W, p._H];
    return { vb: vb, w: p._W, h: Math.round(p._W * vb[3] / vb[2]) };
  }
  function serialize() {
    var p = pane(), c = p._svg.cloneNode(true), sv = saveView(p);
    c.removeAttribute('style');
    c.removeAttribute('class');
    c.setAttribute('viewBox', sv.vb.join(' '));
    c.setAttribute('width', sv.w);
    c.setAttribute('height', sv.h);
    c.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
    Array.prototype.forEach.call(c.querySelectorAll('.w'), function (w) {
      w.removeAttribute('class');
      w.style.animationDelay = '';
    });
    return new XMLSerializer().serializeToString(c);
  }
  function download(href, name) {
    var a = make('a', { href: href, download: name });
    body.appendChild(a);
    a.click();
    body.removeChild(a);
  }
  function save(fmt) {
    var xml = serialize(), name = stem() + '.' + fmt;
    if (fmt === 'svg') {
      var url = URL.createObjectURL(new Blob([xml], { type: 'image/svg+xml' }));
      download(url, name);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      return;
    }
    var p = pane(), sv = saveView(p), W = sv.w, H = sv.h;
    var bytes = new TextEncoder().encode(xml), bin = '';
    for (var i = 0; i < bytes.length; i += 8192) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
    var canvas = make('canvas');
    canvas.width = 2 * W;
    canvas.height = 2 * H;
    var ctx = canvas.getContext('2d');
    ctx.fillStyle = THEMES[state.theme].bg;
    ctx.fillRect(0, 0, 2 * W, 2 * H);
    var img = new Image();
    img.onload = function () {
      ctx.drawImage(img, 0, 0, 2 * W, 2 * H);
      download(canvas.toDataURL(fmt === 'jpg' ? 'image/jpeg' : 'image/png', 0.95), name);
    };
    img.onerror = function (e) { console.error('calligram: image export failed', e); };
    img.src = 'data:image/svg+xml;base64,' + btoa(bin);
  }
  window.wcSave = save;

  // ── panel open / closed ───────────────────────────────────────────────────
  function setPanel(open) {
    if (!panelEl) return;
    panelEl.classList.toggle('open', open);
    panelEl.classList.toggle('rail', !open);
    fit();
    setTimeout(fit, 260);
  }
  function openSearch() {
    setPanel(true);
    if (ui.search) { ui.search.focus(); ui.search.select(); }
  }
  function unhideAll() {
    pane()._words.forEach(function (w) { w.removeAttribute('data-hidden'); });
    apply();
  }
  function setThreshold(v) { pane()._thr = +v; apply(); }

  // ── keyboard shortcuts ────────────────────────────────────────────────────
  var KEYS = [
    ['/', 'Search'], ['Esc', 'Clear search / close'], ['+  \u2212', 'Zoom in / out'], ['0', 'Reset zoom'],
    ['F', 'Fullscreen'], ['P', 'Open / collapse panel'], ['T', 'Light / dark background'],
    ['C', 'Next colour palette'], ['H', 'Show hidden words'], ['\u2190  \u2192', 'Previous / next group'], ['?', 'This list']
  ];
  function toggleHelp(force) {
    if (!ui.help) return;
    var on = force != null ? force : ui.help.style.display === 'none';
    ui.help.style.display = on ? 'flex' : 'none';
  }
  if (cfg.toolbar) {
    doc.addEventListener('keydown', function (ev) {
      if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
      if (typing(ev)) {
        if (ev.key === 'Escape') { ev.target.value = ''; state.query = ''; ev.target.blur(); apply(); }
        return;
      }
      var k = ev.key;
      if (k === '/') { ev.preventDefault(); openSearch(); }
      else if (k === 'Escape') { toggleHelp(false); if (state.query) { state.query = ''; if (ui.search) ui.search.value = ''; apply(); } }
      else if (k === '+' || k === '=') zoomCentre(0.8);
      else if (k === '-' || k === '_') zoomCentre(1.25);
      else if (k === '0') zoomReset();
      else if (k === 'f' || k === 'F') toggleFullscreen();
      else if (k === 'p' || k === 'P') setPanel(!panelEl.classList.contains('open'));
      else if (k === 't' || k === 'T') setTheme(state.theme === 'orig' ? 'alt' : 'orig');
      else if (k === 'c' || k === 'C') cyclePalette();
      else if (k === 'h' || k === 'H') unhideAll();
      else if (k === '?') toggleHelp();
      else if (k === 'ArrowRight' && panes.length > 1) show((state.active + 1) % panes.length, true);
      else if (k === 'ArrowLeft' && panes.length > 1) show((state.active + panes.length - 1) % panes.length, true);
    });
  }

  // ── build the panel ───────────────────────────────────────────────────────
  function section(title) {
    var s = make('section', { 'class': 'sec' });
    if (title) s.appendChild(make('h2', null, title));
    return s;
  }
  function slider(vertical) {
    var s = make('input', { type: 'range', min: '1', max: '1', step: '1', value: '1', 'aria-label': 'Minimum count' });
    if (vertical) { s.setAttribute('orient', 'vertical'); s.className = 'vrange'; }
    s.addEventListener('input', function () { setThreshold(s.value); });
    sliders.push(s);
    return s;
  }
  if (cfg.toolbar && panelEl) {
    // the rail (collapsed state): icons and a vertical slider
    var rail = make('div', { 'class': 'railbox' });
    ui.toggle = iconButton('left', 'Expand panel (P)', function () { setPanel(true); });
    rail.appendChild(ui.toggle);
    rail.appendChild(iconButton('search', 'Search words (/)', openSearch));
    var vs = make('div', { 'class': 'vsl', title: 'Minimum count' });
    vs.appendChild(slider(true));
    ui.railThr = make('span', { 'class': 'vlab' });
    vs.appendChild(ui.railThr);
    rail.appendChild(vs);
    ui.railEye = iconButton('eye', 'Show hidden words (H)', unhideAll);
    ui.railEye.classList.add('badge');
    rail.appendChild(ui.railEye);
    rail.appendChild(iconButton('theme', 'Light / dark background (T)', function () { setTheme(state.theme === 'orig' ? 'alt' : 'orig'); }));
    if (!cfg.fixedcolors) {
      ui.railPal = iconButton('palette', 'Colours: As drawn (click for next)', cyclePalette);
      rail.appendChild(ui.railPal);
    }
    rail.appendChild(make('div', { 'class': 'sep' }));
    rail.appendChild(iconButton('plus', 'Zoom in (+)', function () { zoomCentre(0.8); }));
    rail.appendChild(iconButton('minus', 'Zoom out (\u2212)', function () { zoomCentre(1.25); }));
    rail.appendChild(iconButton('reset', 'Reset zoom (0)', zoomReset));
    rail.appendChild(iconButton('full', 'Fullscreen (F)', toggleFullscreen));
    rail.appendChild(make('div', { 'class': 'sep' }));
    rail.appendChild(iconButton('save', 'Save as PNG', function () { save('png'); }));
    rail.appendChild(iconButton('help', 'Keyboard shortcuts (?)', function () { toggleHelp(); }));

    // the open panel: labelled sections
    var full = make('div', { 'class': 'fullbox' });
    var head = make('div', { 'class': 'phead' });
    head.appendChild(make('span', { 'class': 'ptitle' }, 'Explore'));
    head.appendChild(iconButton('right', 'Collapse panel (P)', function () { setPanel(false); }));
    full.appendChild(head);

    var s1 = section(null);
    var sw = make('div', { 'class': 'searchwrap' });
    var si = make('span', { 'class': 'sicon' });
    si.innerHTML = svgIcon('search');
    sw.appendChild(si);
    ui.search = make('input', { type: 'search', placeholder: 'Search words', 'aria-label': 'Search words' });
    ui.search.addEventListener('input', function () { state.query = ui.search.value.trim(); apply(); });
    sw.appendChild(ui.search);
    s1.appendChild(sw);
    ui.hits = make('div', { 'class': 'note' });
    s1.appendChild(ui.hits);
    full.appendChild(s1);

    var s2 = section('Minimum count');
    var sr = make('div', { 'class': 'hrow' });
    sr.appendChild(slider(false));
    ui.thrLabel = make('span', { 'class': 'note' });
    sr.appendChild(ui.thrLabel);
    s2.appendChild(sr);
    full.appendChild(s2);

    var s3 = section('Top words');
    ui.list = make('ol', { 'class': 'list' });
    s3.appendChild(ui.list);
    ui.more = make('button', { type: 'button', 'class': 'linkbtn' }, 'Show all');
    ui.more.addEventListener('click', function () { state.listAll = !state.listAll; renderList(); });
    s3.appendChild(ui.more);
    ui.unhide = make('button', { type: 'button', 'class': 'linkbtn' }, 'No hidden words');
    ui.unhide.addEventListener('click', unhideAll);
    s3.appendChild(ui.unhide);
    s3.appendChild(make('div', { 'class': 'hint' }, 'Click a word in the cloud or in this list to hide it.'));
    full.appendChild(s3);

    var s4 = section('View');
    var vr = make('div', { 'class': 'brow' });
    vr.appendChild(iconButton('minus', 'Zoom out (\u2212)', function () { zoomCentre(1.25); }));
    vr.appendChild(iconButton('plus', 'Zoom in (+)', function () { zoomCentre(0.8); }));
    vr.appendChild(iconButton('reset', 'Reset zoom (0)', zoomReset));
    vr.appendChild(iconButton('full', 'Fullscreen (F)', toggleFullscreen));
    s4.appendChild(vr);
    s4.appendChild(make('div', { 'class': 'hint' }, 'Scroll to zoom, drag to move around.'));
    full.appendChild(s4);

    var s5 = section('Appearance');
    ui.themeBtn = make('button', { type: 'button', 'class': 'btn' }, '');
    ui.themeBtn.addEventListener('click', function () { setTheme(state.theme === 'orig' ? 'alt' : 'orig'); });
    s5.appendChild(ui.themeBtn);
    var sg = make('div', { 'class': 'swatches' });
    ui.swatches = PALETTES.map(function (q) {
      var b = make('button', { type: 'button', 'class': 'swatch', 'data-id': q.id, title: q.name, 'aria-label': 'Colours: ' + q.name });
      var cols = q.id === 'orig' ? panes[0]._words.slice(0, 4).map(function (w) { return w.getAttribute('data-fill0'); })
        : q.id === 'greys' ? ['#f5f5f5', '#bdbdbd', '#8a8a8a'] : q.colors.slice(0, 4);
      b.style.background = 'linear-gradient(90deg,' + cols.join(',') + ')';
      b.addEventListener('click', function () { setPalette(q.id); });
      sg.appendChild(b);
      return b;
    });
    if (!cfg.fixedcolors) s5.appendChild(sg);
    else s5.appendChild(make('div', { 'class': 'hint' }, 'Colours show a variable (see the key under the cloud).'));
    full.appendChild(s5);

    var s6 = section('Save image');
    var br = make('div', { 'class': 'brow' });
    ['png', 'svg', 'jpg'].forEach(function (f) {
      var b = make('button', { type: 'button', 'class': 'btn', title: 'Save what is shown as ' + f.toUpperCase() }, f.toUpperCase());
      b.addEventListener('click', function () { save(f); });
      br.appendChild(b);
    });
    s6.appendChild(br);
    full.appendChild(s6);

    var foot = make('div', { 'class': 'pfoot' });
    var hb = make('button', { type: 'button', 'class': 'linkbtn' }, 'Keyboard shortcuts  ?');
    hb.addEventListener('click', function () { toggleHelp(); });
    foot.appendChild(hb);
    foot.appendChild(make('span', { 'class': 'credit' }, 'calligram for Stata'));
    full.appendChild(foot);

    panelEl.appendChild(rail);
    panelEl.appendChild(full);

    // shortcuts list
    ui.help = make('div', { 'class': 'help', role: 'dialog', 'aria-label': 'Keyboard shortcuts' });
    ui.help.style.display = 'none';
    var card = make('div', { 'class': 'helpcard' });
    card.appendChild(make('h2', null, 'Keyboard shortcuts'));
    var tbl = make('table');
    KEYS.forEach(function (k) {
      var tr = make('tr');
      var td1 = make('td');
      td1.appendChild(make('kbd', null, k[0]));
      tr.appendChild(td1);
      tr.appendChild(make('td', null, k[1]));
      tbl.appendChild(tr);
    });
    card.appendChild(tbl);
    var close = make('button', { type: 'button', 'class': 'btn' }, 'Close');
    close.addEventListener('click', function () { toggleHelp(false); });
    card.appendChild(close);
    ui.help.appendChild(card);
    ui.help.addEventListener('click', function (ev) { if (ev.target === ui.help) toggleHelp(false); });
    body.appendChild(ui.help);
  }

  // A single save button (export() option without the panel)
  var legacy = doc.getElementById('expbtn');
  if (legacy) legacy.addEventListener('click', function () { save(legacy.getAttribute('data-fmt') || 'png'); });

  // ── tabs for by() groups ──────────────────────────────────────────────────
  if (panes.length > 1 && tabsEl) {
    tabsEl.setAttribute('role', 'tablist');
    ui.tabs = panes.map(function (p, k) {
      var b = make('button', { type: 'button', role: 'tab' }, p.getAttribute('data-label') || ('Group ' + (k + 1)));
      b.addEventListener('click', function () { if (k !== state.active) show(k, true); });
      tabsEl.appendChild(b);
      return b;
    });
    body.classList.add('has-tabs');
  }

  body.classList.add('wc-ui');
  if (!cfg.fixed) body.classList.add('wc-fit');   // lock the page to the window only when fitting
  setTheme('orig');
  setPalette('orig');
  if (panelEl && cfg.toolbar) setPanel(window.innerWidth >= 1100);
  show(0, false);

  // Start the fade-in once the page has loaded and is being drawn, so it is
  // never over before it is seen. The head of the page hides the words until
  // then (class wc-pre on <html>).
  function reveal() {
    var raf = window.requestAnimationFrame || function (f) { return setTimeout(f, 16); };
    raf(function () {
      fit();
      enter(pane());
      doc.documentElement.classList.remove('wc-pre');
    });
  }
  if (doc.readyState === 'complete') reveal();
  else window.addEventListener('load', reveal);
})();
</script>
</body></html>
